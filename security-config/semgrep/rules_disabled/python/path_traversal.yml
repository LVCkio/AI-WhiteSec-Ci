# Disabled rules; excluded from the active bundle. See metadata.disabled_v460.
rules:
- id: team.audit.file-path-api
  languages:
  - python
  severity: WARNING
  message: A file system API receives a non-literal path (audit hint).
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.2.0
    ruleset_version: 4.6.0
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
    previous_rule_version: 1.1.0
    disabled_v460: 'TC4 train v2.2: 9/28 correct class (0.321), 36 negative hits. Dynamic open/remove/copy/makedirs
      alone gives no evidence of traversal or external control; existing narrower path/taint rules remain active.'
    disabled_date: '2026-10-26'
  patterns:
  - pattern-either:
    - pattern: open($P, ...)
    - pattern: send_file($P, ...)
    - pattern: os.remove($P)
    - pattern: os.unlink($P)
    - pattern: shutil.rmtree($P, ...)
    - pattern: shutil.copy($P, ...)
    - pattern: os.makedirs($P, ...)
    - pattern: $Z.extract($M, ...)
  - pattern-not: open("...", ...)
  - pattern-not: send_file("...", ...)
- id: team.path-from-parameter
  languages:
  - python
  severity: WARNING
  message: A function argument is used to build a filesystem path without normalisation.
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.8.0
    disabled_v480: 'Tat trong v4.8.0 (vai tro Semgrep la ve tinh cho CodeBERT; tieu chi TC4 v4.8 tinh precision mau gom ca mau am, nguong audit 0.25). precision mau train 10/49 = 0.20 (bo hneg 0.33); val 6/12. Do tren dataset v2.6 (Semgrep 1.181.0, ruleset 4.7.1): Claude outputs/semgrep_v471_val_v26/DE_XUAT_CAT_TIA_v4.7.1.md'
    disabled_date: '2026-11-14'
    tier_exception: 'Taint nhung giu audit (ngoai le semgrep_tool.md 5.2). Source la moi tham so ham, khong phai
      du lieu request, nen chi biet gia tri co the do ben ngoai dua vao, khong chac la dau vao nguoi dung. Train
      v5: 30/34 = 0,88 dung lop, val v5: 4/4 (< 5 hit, chua du de len high theo TC4). Xet lai len high khi val v2.2
      co >= 5 hit va >= 0,80.'
    change_v431: Them metadata tier_exception ghi ly do giu tang audit (khong doi pattern, khong doi ket qua quet).
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: "def $FUNC(..., $PARAM, ...):\n  ...\n"
    - focus-metavariable: $PARAM
    - metavariable-regex:
        metavariable: $PARAM
        regex: ^(?!self$|cls$)\w+$
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.path.join($BASE, ..., $X, ...)
      - pattern: send_file($X, ...)
      - pattern: FileResponse($X, ...)
      - pattern: serve_file($X, ...)
      - patterns:
        - pattern: $BASE / $X
        - metavariable-regex:
            metavariable: $BASE
            regex: (?i).*(?:dir|path|root|folder|base|Path\().*
    - focus-metavariable: $X
  pattern-sanitizers:
  - pattern-either:
    - pattern: os.path.basename(...)
    - pattern: os.path.realpath(...)
    - pattern: os.path.abspath(...)
    - pattern: os.path.normpath(...)
    - pattern: secure_filename(...)
    - pattern: safe_join(...)
    - pattern: $P.resolve(...)
