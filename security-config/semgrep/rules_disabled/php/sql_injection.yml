# Disabled rules; excluded from the active bundle. See metadata.disabled_v480.
rules:
- id: team.php.sqli-string
  languages:
  - php
  severity: WARNING
  message: SQL text is built by concatenation or interpolation (audit).
  metadata:
    cwe: CWE-89
    owasp: A03:2021
    vuln_class: SQL_INJECTION
    confidence: audit
    severity: critical
    scope: PHP; superglobals ($_GET/$_POST/...), mysqli, PDO, pg_*, include/require
    rule_version: 1.0.0
    ruleset_version: 4.8.0
    disabled_v480: 'Tat trong v4.8.0 (vai tro Semgrep la ve tinh cho CodeBERT; tieu chi TC4 v4.8 tinh precision mau gom ca mau am, nguong audit 0.25). precision mau train 33/185 = 0.18 (bo hneg 0.23); val 19/49 = 0.39. Do tren dataset v2.6 (Semgrep 1.181.0, ruleset 4.7.1): Claude outputs/semgrep_v471_val_v26/DE_XUAT_CAT_TIA_v4.7.1.md'
    disabled_date: '2026-11-14'
  pattern-either:
  - pattern-regex: (?i)["'](?:select\s|insert\s+into|delete\s+from|update\s+\w+\s+set)[^"'\n]*(?:["']\s*\.\s*\$|\$\w)
  - pattern-regex: (?i)["'][^"'\n]*\b(?:where|order\s+by|values\s*\()[^"'\n]*(?:["']\s*\.\s*\$|\$\w)
- id: team.php.sqli-taint
  languages:
  - php
  severity: WARNING
  message: Request data reaches an SQL query.
  metadata:
    cwe: CWE-89
    owasp: A03:2021
    vuln_class: SQL_INJECTION
    confidence: audit
    severity: critical
    scope: PHP; superglobals ($_GET/$_POST/...), mysqli, PDO, pg_*, include/require
    rule_version: 1.1.0
    ruleset_version: 4.8.0
    disabled_v480: 'Tat trong v4.8.0 (vai tro Semgrep la ve tinh cho CodeBERT; tieu chi TC4 v4.8 tinh precision mau gom ca mau am, nguong audit 0.25). precision mau train 7/32 = 0.22 (bo hneg 0.29); val 1/3. Do tren dataset v2.6 (Semgrep 1.181.0, ruleset 4.7.1): Claude outputs/semgrep_v471_val_v26/DE_XUAT_CAT_TIA_v4.7.1.md'
    disabled_date: '2026-11-14'
    tier_exception: 'Taint nhung o audit (ngoai le semgrep_tool.md 5.2): train v2.2 dung lop 7/11 = 0,64, dat nguong audit 0,50 nhung chua dat high 0,80 (TC4); val v2.2 < 5 lan bao. Xet lai len high khi do lai tren train/val v2.2 >= 0,80.'
    change_v44: 'Ha high -> audit theo semgrep_tool.md muc 9 / TC4 (R2, 2026-10-25): train v2.2 7/11 = 0,64 < 0,80. severity ERROR -> WARNING (muc 5.3). Pattern khong doi.'
  mode: taint
  pattern-sources:
  - pattern: $_GET
  - pattern: $_POST
  - pattern: $_REQUEST
  - pattern: $_COOKIE
  - pattern: $_SERVER['QUERY_STRING']
  - pattern: $_SERVER['REQUEST_URI']
  - pattern: $_SERVER['HTTP_USER_AGENT']
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: mysqli_query($C, $Q, ...)
      - pattern: mysql_query($Q, ...)
      - pattern: pg_query($C, $Q)
      - pattern: sqlite_query($C, $Q)
      - pattern: $DB->query($Q, ...)
      - pattern: $DB->exec($Q)
      - pattern: $DB->prepare($Q, ...)
      - pattern: mysqli_prepare($C, $Q)
    - focus-metavariable: $Q
  pattern-sanitizers:
  - pattern: intval(...)
  - pattern: (int) $X
  - pattern: floatval(...)
  - pattern: $DB->quote(...)
  - pattern: mysqli_real_escape_string(...)
  - pattern: is_numeric(...)
