# Ruleset AI-WhiteSec-CI v4.2.0 | ngon ngu: php | lop: PATH_TRAVERSAL
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/php/path_traversal.* (phai bao) va tests/negative/php/path_traversal.* (khong duoc bao).
rules:
- id: team.php.path-taint
  languages:
  - php
  severity: WARNING
  message: Request data is used as a file path or included file.
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: PHP; superglobals ($_GET/$_POST/...), mysqli, PDO, pg_*, include/require
    rule_version: 1.2.0
    ruleset_version: 4.3.1
    tier_exception: 'Taint nhung o audit (ngoai le semgrep_tool.md 5.2). Train v5 chi dung lop 7/13 = 0,54: dat nguong audit 0,50, chua dat high 0,80 (TC4). Rot TC5-audit (ban va 10 > ban loi 7) nhung giu vi la rule PHP PATH_TRAVERSAL gan nhu duy nhat; can ra tay cac hit tren train v2.2 truoc khi quyet dinh giu hay tat.'
    change_v431: 'Them metadata tier_exception ghi ly do o tang audit (khong doi pattern, khong doi ket qua quet).'
    change_v43: 'Ha high -> audit theo semgrep_tool.md muc 9 / TC4: train v5 dung lop 7/13 = 0,54 < 0,80 (dat nguong audit 0,50). Ngoai le: van rot TC5-audit (ban va 10 > ban loi 7) nhung la rule PHP PATH_TRAVERSAL gan nhu duy nhat con lai. severity ERROR -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
  mode: taint
  pattern-sources:
  - pattern: $_GET
  - pattern: $_POST
  - pattern: $_REQUEST
  - pattern: $_COOKIE
  - pattern: $_SERVER['QUERY_STRING']
  - pattern: $_SERVER['REQUEST_URI']
  - pattern: $_SERVER['HTTP_USER_AGENT']
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: include $X;
      - pattern: include_once $X;
      - pattern: require $X;
      - pattern: require_once $X;
      - pattern: file_get_contents($X, ...)
      - pattern: fopen($X, ...)
      - pattern: readfile($X, ...)
      - pattern: file($X, ...)
      - pattern: unlink($X, ...)
      - pattern: file_put_contents($X, ...)
      - pattern: copy($X, ...)
    - focus-metavariable: $X
  pattern-sanitizers:
  - pattern: basename(...)
  - pattern: intval(...)
