# AI-WhiteSec-CI Semgrep ruleset v4.3.0 - FILE SINH TU DONG tu rules/, khong sua tay.
# Tao bang: python security-config/semgrep/tools/ruleset.py build
rules:
- id: team.java.auth-jwt-unverified
  languages:
  - java
  severity: ERROR
  message: A JWT is parsed without requiring a valid signature.
  metadata:
    cwe: CWE-287
    owasp: A07:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: high
    severity: high
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  pattern-either:
  - pattern: Jwts.parser().$X(...).parse($T)
  - pattern: Jwts.parser().parse($T)
  - pattern: JWT.decode($T)
  - pattern: $P.parseClaimsJwt($T)
- id: team.java.auth-weak-password-hash
  languages:
  - java
  severity: WARNING
  message: A fast/broken hash is used for passwords (audit).
  metadata:
    cwe: CWE-916
    owasp: A02:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: audit
    severity: high
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.1.0
    ruleset_version: 4.3.0
    change_v4: Chi bao khi gia tri duoc bam la mat khau (truoc day bao moi MessageDigest MD5).
  patterns:
  - pattern-either:
    - pattern: DigestUtils.md5Hex($P)
    - pattern: DigestUtils.sha1Hex($P)
    - pattern: $MD.digest($P.getBytes(...))
    - pattern: $MD.update($P.getBytes(...))
    - pattern: $MD.digest($P)
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^\w*(pass|pwd|secret)\w*$
- id: team.java.hardcoded-password-compare
  languages:
  - java
  severity: ERROR
  message: A password or secret is compared with a hardcoded literal.
  metadata:
    cwe: CWE-259
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.0.0
    ruleset_version: 4.3.0
    change_v4: Rule moi trong v4.
  patterns:
  - pattern-either:
    - pattern: '"$LIT".equals($P)'
    - pattern: $P.equals("$LIT")
    - pattern: '"$LIT".equalsIgnoreCase($P)'
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^[\w.]*(password|passwd|pwd|secret|apikey|api_key)[\w.]*$
  - metavariable-regex:
      metavariable: $LIT
      regex: ^.{4,}$
- id: team.java.hardcoded-secret
  languages:
  - java
  severity: ERROR
  message: A credential or signing key is a hardcoded literal.
  metadata:
    cwe: CWE-798
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: $TYPE $NAME = "$VAL";
      - pattern: $NAME = "$VAL";
    - metavariable-regex:
        metavariable: $NAME
        regex: (?i).*(password|passwd|pwd|secret|api_?key|access_?token|private_?key|jwt_?key|signing_?key).*
    - metavariable-regex:
        metavariable: $VAL
        regex: ^.{4,}$
  - pattern: DriverManager.getConnection($URL, $USER, "...")
  - pattern: $B.signWith($ALG, "...")
  - pattern: $B.setSigningKey("...")
  - pattern: Algorithm.HMAC256("...")
- id: team.java.cmdi-taint
  languages:
  - java
  severity: ERROR
  message: Request data reaches an OS command.
  metadata:
    cwe: CWE-78
    owasp: A03:2021
    vuln_class: OS_COMMAND_INJECTION
    confidence: high
    severity: critical
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  mode: taint
  pattern-sources:
  - pattern: (javax.servlet.http.HttpServletRequest $R).$GET(...)
  - pattern: (jakarta.servlet.http.HttpServletRequest $R).$GET(...)
  - pattern: (HttpServletRequest $R).$GET(...)
  - patterns:
    - pattern-inside: '$RT $METHOD(..., @$ANNO(...) $TYPE $PARAM, ...) { ... }

        '
    - pattern: $PARAM
    - metavariable-regex:
        metavariable: $ANNO
        regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue)$
  - patterns:
    - pattern-inside: '$RT $METHOD(..., @$ANNO $TYPE $PARAM, ...) { ... }

        '
    - pattern: $PARAM
    - metavariable-regex:
        metavariable: $ANNO
        regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue)$
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: Runtime.getRuntime().exec($X, ...)
      - pattern: (Runtime $RT).exec($X, ...)
      - pattern: new ProcessBuilder($X, ...)
      - pattern: (ProcessBuilder $PB).command($X, ...)
    - focus-metavariable: $X
  pattern-sanitizers:
  - pattern: Integer.parseInt(...)
  - pattern: Long.parseLong(...)
  - pattern: Integer.valueOf(...)
  - pattern: UUID.fromString(...)
- id: team.java.audit.process-api
  languages:
  - java
  severity: WARNING
  message: A process API is used (audit hint).
  metadata:
    cwe: CWE-78
    owasp: A03:2021
    vuln_class: OS_COMMAND_INJECTION
    confidence: audit
    severity: critical
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.2.0
    ruleset_version: 4.3.0
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
    change_v4: Bo lenh la hang chuoi (khong the bi chen du lieu).
  patterns:
  - pattern-either:
    - pattern: Runtime.getRuntime().exec(...)
    - pattern: (Runtime $R).exec(...)
    - pattern: new ProcessBuilder(...)
  - pattern-not: Runtime.getRuntime().exec("...")
  - pattern-not: new ProcessBuilder("...")
- id: team.java.cmd-string
  languages:
  - java
  severity: WARNING
  message: An OS command is built from a concatenated string (audit).
  metadata:
    cwe: CWE-78
    owasp: A03:2021
    vuln_class: OS_COMMAND_INJECTION
    confidence: audit
    severity: critical
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  pattern-either:
  - pattern: Runtime.getRuntime().exec("..." + $X, ...)
  - pattern: Runtime.getRuntime().exec($X + "...", ...)
  - pattern: new ProcessBuilder("sh", "-c", ...)
  - pattern: new ProcessBuilder("bash", "-c", ...)
  - pattern: new ProcessBuilder("cmd", "/c", ...)
- id: team.java.audit.commandline-api
  languages:
  - java
  severity: WARNING
  message: A command line is built from a non-literal value (Apache Commons Exec / command builders) (audit hint).
  metadata:
    cwe: CWE-78
    owasp: A03:2021
    vuln_class: OS_COMMAND_INJECTION
    confidence: audit
    severity: critical
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.1.0
    ruleset_version: 4.3.0
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
    change_v4: Rule moi trong v4.1.0 (bo sung do phu, tu phan tich mau bi bo sot tren train v5).
  patterns:
  - pattern-either:
    - pattern: new CommandLine($X, ...)
    - pattern: CommandLine.parse($X, ...)
    - pattern: $CL.addArgument($X, ...)
    - pattern: $CL.addArguments($X, ...)
    - pattern: $CL.withArg($X)
    - pattern: $CL.withArgs(...)
    - pattern: CommandLine.createCommandLine($X)
  - pattern-not: new CommandLine("...", ...)
  - pattern-not: CommandLine.parse("...", ...)
  - pattern-not: $CL.addArgument("...", ...)
  - pattern-not: $CL.withArg("...")
  - pattern-not: CommandLine.createCommandLine("...")
- id: team.java.path-taint
  languages:
  - java
  severity: ERROR
  message: Request data is used as a file system path.
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: high
    severity: high
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  mode: taint
  pattern-sources:
  - pattern: (javax.servlet.http.HttpServletRequest $R).$GET(...)
  - pattern: (jakarta.servlet.http.HttpServletRequest $R).$GET(...)
  - pattern: (HttpServletRequest $R).$GET(...)
  - patterns:
    - pattern-inside: '$RT $METHOD(..., @$ANNO(...) $TYPE $PARAM, ...) { ... }

        '
    - pattern: $PARAM
    - metavariable-regex:
        metavariable: $ANNO
        regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue)$
  - patterns:
    - pattern-inside: '$RT $METHOD(..., @$ANNO $TYPE $PARAM, ...) { ... }

        '
    - pattern: $PARAM
    - metavariable-regex:
        metavariable: $ANNO
        regex: ^(RequestParam|PathVariable|RequestBody|RequestHeader|CookieValue)$
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: new File($X)
      - pattern: new File($D, $X)
      - pattern: new FileInputStream($X)
      - pattern: new FileOutputStream($X, ...)
      - pattern: new FileReader($X)
      - pattern: Paths.get($X, ...)
      - pattern: Path.of($X, ...)
      - pattern: $BASE.resolve($X)
    - focus-metavariable: $X
  pattern-sanitizers:
  - pattern: FilenameUtils.getName(...)
  - pattern: Paths.get(...).getFileName()
  - pattern: (File $F).getName()
- id: team.java.audit.file-path-api
  languages:
  - java
  severity: WARNING
  message: A file system API receives a non-literal path (audit hint).
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.1.0
    ruleset_version: 4.3.0
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
  patterns:
  - pattern-either:
    - pattern: new File($P)
    - pattern: new File($D, $P)
    - pattern: new FileInputStream($P)
    - pattern: new FileOutputStream($P, ...)
    - pattern: Paths.get($P, ...)
    - pattern: Path.of($P, ...)
    - pattern: $BASE.resolve($P)
    - pattern: $CTX.getResourceAsStream($P)
    - pattern: $CTX.getRealPath($P)
    - pattern: new ZipFile($P)
    - pattern: $ZIS.getNextEntry()
  - pattern-not: new File("...")
  - pattern-not: new File($D, "...")
  - pattern-not: Paths.get("...")
  - pattern-not: $BASE.resolve("...")
- id: team.java.path-upload-name
  languages:
  - java
  severity: WARNING
  message: A client-supplied file name or archive entry name is used as a path (audit).
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  pattern-either:
  - pattern: new File($D, $F.getOriginalFilename())
  - pattern: $D.resolve($F.getOriginalFilename())
  - pattern: new File($D, $E.getName())
  - pattern: $D.resolve($E.getName())
