  - pattern-not: $C.prepareStatement("...", ...)
  - pattern-not: $EM.createQuery("...", ...)
- id: team.java.sqli-concat
  languages:
  - java
  severity: WARNING
  message: SQL text is built by string concatenation (audit).
  metadata:
    cwe: CWE-89
    owasp: A03:2021
    vuln_class: SQL_INJECTION
    confidence: audit
    severity: critical
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  pattern-either:
  - pattern-regex: (?i)"\s*(?:select\s|insert\s+into|delete\s+from|update\s+\w+\s+set|where\s|order\s+by)[^"\n]*"\s*\+\s*[\w(]
  - pattern-regex: (?i)"[^"\n]*\b(?:where|order\s+by|values\s*\()[^"\n]*"\s*\+\s*[\w(]
