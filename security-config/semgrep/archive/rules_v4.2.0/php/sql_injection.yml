# Ruleset AI-WhiteSec-CI v4.2.0 | ngon ngu: php | lop: SQL_INJECTION
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/php/sql_injection.* (phai bao) va tests/negative/php/sql_injection.* (khong duoc bao).
rules:
- id: team.php.sqli-taint
  languages:
  - php
  severity: ERROR
  message: Request data reaches an SQL query.
  metadata:
    cwe: CWE-89
    owasp: A03:2021
    vuln_class: SQL_INJECTION
    confidence: high
    severity: critical
    scope: PHP; superglobals ($_GET/$_POST/...), mysqli, PDO, pg_*, include/require
    rule_version: 1.0.0
    ruleset_version: 4.2.0
  mode: taint
  pattern-sources:
  - pattern: $_GET
  - pattern: $_POST
  - pattern: $_REQUEST
  - pattern: $_COOKIE
  - pattern: $_SERVER['QUERY_STRING']
  - pattern: $_SERVER['REQUEST_URI']
  - pattern: $_SERVER['HTTP_USER_AGENT']
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: mysqli_query($C, $Q, ...)
      - pattern: mysql_query($Q, ...)
      - pattern: pg_query($C, $Q)
      - pattern: sqlite_query($C, $Q)
      - pattern: $DB->query($Q, ...)
      - pattern: $DB->exec($Q)
      - pattern: $DB->prepare($Q, ...)
      - pattern: mysqli_prepare($C, $Q)
    - focus-metavariable: $Q
  pattern-sanitizers:
  - pattern: intval(...)
  - pattern: (int) $X
  - pattern: floatval(...)
  - pattern: $DB->quote(...)
  - pattern: mysqli_real_escape_string(...)
  - pattern: is_numeric(...)
- id: team.php.sqli-string
  languages:
  - php
  severity: WARNING
  message: SQL text is built by concatenation or interpolation (audit).
  metadata:
    cwe: CWE-89
    owasp: A03:2021
    vuln_class: SQL_INJECTION
    confidence: audit
    severity: critical
    scope: PHP; superglobals ($_GET/$_POST/...), mysqli, PDO, pg_*, include/require
    rule_version: 1.0.0
    ruleset_version: 4.2.0
  pattern-either:
  - pattern-regex: (?i)["'](?:select\s|insert\s+into|delete\s+from|update\s+\w+\s+set)[^"'\n]*(?:["']\s*\.\s*\$|\$\w)
  - pattern-regex: (?i)["'][^"'\n]*\b(?:where|order\s+by|values\s*\()[^"'\n]*(?:["']\s*\.\s*\$|\$\w)
- id: team.php.audit.sql-api
  languages:
  - php
  severity: INFO
  message: An SQL API receives a dynamic query (audit hint).
  metadata:
    cwe: CWE-89
    owasp: A03:2021
    vuln_class: SQL_INJECTION
    confidence: audit
    severity: critical
    scope: PHP; superglobals ($_GET/$_POST/...), mysqli, PDO, pg_*, include/require
    rule_version: 1.0.0
    ruleset_version: 4.2.0
    change_v4: Rule moi trong v4.1.0 (bo sung do phu, tu phan tich mau bi bo sot tren train v5).
  patterns:
  - pattern-either:
    - pattern: $DB->query($Q, ...)
    - pattern: $DB->exec($Q)
    - pattern: $DB->get_results($Q, ...)
    - pattern: $DB->get_row($Q, ...)
    - pattern: $DB->get_var($Q, ...)
    - pattern: $DB->get_col($Q, ...)
    - pattern: mysqli_query($C, $Q, ...)
    - pattern: mysql_query($Q, ...)
    - pattern: pg_query($C, $Q)
    - pattern: $S->where($Q, ...)
    - patterns:
      - pattern: $DB->execute($Q, ...)
      - metavariable-regex:
          metavariable: $DB
          regex: (?i)^\$(this->)?(z?db|conn\w*|adapter|pdo|mysqli?|database|\w*_db|dbh)$
  - metavariable-regex:
      metavariable: $Q
      regex: (?s).*\$
