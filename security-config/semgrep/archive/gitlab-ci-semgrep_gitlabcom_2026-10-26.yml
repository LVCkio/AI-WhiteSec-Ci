# AI-WhiteSec-CI - nhanh P2 Semgrep cho GitLab CI.
# Dung trong .gitlab-ci.yml o goc repo:
#   stages: [build-image, sast, compare, gate]
#   include:
#     - local: security-config/semgrep/ci/gitlab-ci-semgrep.yml
# Quyet dinh (QUYET_DINH_SEMGREP.md): GitLab CI; runner Docker; Semgrep ghim 1.181.0;
# finding tang audit chi ghi nhan, KHONG chan build. Job nay KHONG chan build vi finding:
# no chi that bai khi loi cau hinh/moi truong (ma 2) hoac Semgrep loi (ma 3). Viec chan do job gate.

variables:
  AIWS_RULESET_VERSION: "4.6.1"
  AIWS_SEMGREP_VERSION: "1.181.0"
  AIWS_SEMGREP_IMAGE: "$CI_REGISTRY_IMAGE/aiws-semgrep:$AIWS_RULESET_VERSION-semgrep$AIWS_SEMGREP_VERSION"

# Build va day anh len GitLab Container Registry khi bo rule / taxonomy / Dockerfile doi tren nhanh mac dinh.
# Can runner Docker co quyen privileged (docker:dind). Chay tay duoc tu giao dien (Run pipeline).
aiws-semgrep-image:
  stage: build-image
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - security-config/semgrep/rules/**/*
        - security-config/semgrep/semgrep.yml
        - security-config/semgrep/ruleset-manifest.json
        - security-config/semgrep/.semgrepignore
        - security-config/semgrep/tools/*.py
        - security-config/semgrep/ci/*
        - docs/taxonomy.yml
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg SEMGREP_VERSION="$AIWS_SEMGREP_VERSION"
        -f security-config/semgrep/ci/Dockerfile -t "$AIWS_SEMGREP_IMAGE" .
    - docker push "$AIWS_SEMGREP_IMAGE"

# P2: quet ca repo bang bo rule team.* da dong goi trong anh, xuat semgrep-results.json + scope.json.
aiws-semgrep:
  stage: sast
  image:
    name: "$AIWS_SEMGREP_IMAGE"
    entrypoint: [""]
  needs:
    - job: aiws-semgrep-image
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GIT_DEPTH: "1"
  script:
    - python /opt/aiws/security-config/semgrep/tools/scan_repo.py
        --repo "$CI_PROJECT_DIR"
        --repo-name "$CI_PROJECT_PATH"
        --out "$CI_PROJECT_DIR/semgrep-results.json"
        --scope-out "$CI_PROJECT_DIR/scope.json"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - semgrep-results.json
      - scope.json
