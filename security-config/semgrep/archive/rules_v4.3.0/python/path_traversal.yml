# Ruleset AI-WhiteSec-CI v4.2.0 | ngon ngu: python | lop: PATH_TRAVERSAL
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/python/path_traversal.* (phai bao) va tests/negative/python/path_traversal.* (khong duoc bao).
rules:
- id: team.path-request-taint
  languages:
  - python
  severity: ERROR
  message: Request data is used as a file system path.
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: high
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  mode: taint
  pattern-sources:
  - pattern: request.args
  - pattern: request.form
  - pattern: request.values
  - pattern: request.files
  - pattern: request.GET
  - pattern: request.POST
  - pattern: request.path_params
  - pattern: request.query_params
  - pattern: request.match_info
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: open($X, ...)
      - pattern: send_file($X, ...)
      - pattern: FileResponse($X, ...)
      - pattern: os.path.join($BASE, ..., $X, ...)
      - pattern: os.remove($X)
      - pattern: os.unlink($X)
      - pattern: shutil.rmtree($X, ...)
      - pattern: Path($X, ...)
    - focus-metavariable: $X
  pattern-sanitizers:
  - pattern: os.path.basename(...)
  - pattern: secure_filename(...)
  - pattern: safe_join(...)
  - pattern: int(...)
- id: team.path-traversal
  languages:
  - python
  severity: ERROR
  message: A user-controlled path may reach a filesystem operation.
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: high
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.3.0
    change_v43: 'severity WARNING -> ERROR (semgrep_tool.md 5.3: severity suy tu confidence high).'
  pattern-regex: (?i)\b(?:open|Path|send_file|send_from_directory|FileResponse|serve_file|join)\s*\([^)\n]*(?:request\.(?:args|form|values|json|files|GET|POST|path_params|query_params|match_info))
- id: team.archive-extract-all
  languages:
  - python
  severity: WARNING
  message: Archive members are extracted without filtering their paths.
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  patterns:
  - pattern-either:
    - pattern: $ARCHIVE.extractall(...)
    - pattern: $ARCHIVE.extractfile(...)
  - pattern-not: $ARCHIVE.extractall(..., filter=$F, ...)
- id: team.audit.file-path-api
  languages:
  - python
  severity: WARNING
  message: A file system API receives a non-literal path (audit hint).
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.3.0
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
  patterns:
  - pattern-either:
    - pattern: open($P, ...)
    - pattern: send_file($P, ...)
    - pattern: os.remove($P)
    - pattern: os.unlink($P)
    - pattern: shutil.rmtree($P, ...)
    - pattern: shutil.copy($P, ...)
    - pattern: os.makedirs($P, ...)
    - pattern: $Z.extract($M, ...)
  - pattern-not: open("...", ...)
  - pattern-not: send_file("...", ...)
- id: team.path-from-parameter
  languages:
  - python
  severity: WARNING
  message: A function argument is used to build a filesystem path without normalisation.
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: "def $FUNC(..., $PARAM, ...):\n  ...\n"
    - focus-metavariable: $PARAM
    - metavariable-regex:
        metavariable: $PARAM
        regex: ^(?!self$|cls$)\w+$
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.path.join($BASE, ..., $X, ...)
      - pattern: send_file($X, ...)
      - pattern: FileResponse($X, ...)
      - pattern: serve_file($X, ...)
      - patterns:
        - pattern: $BASE / $X
        - metavariable-regex:
            metavariable: $BASE
            regex: (?i).*(?:dir|path|root|folder|base|Path\().*
    - focus-metavariable: $X
  pattern-sanitizers:
  - pattern-either:
    - pattern: os.path.basename(...)
    - pattern: os.path.realpath(...)
    - pattern: os.path.abspath(...)
    - pattern: os.path.normpath(...)
    - pattern: secure_filename(...)
    - pattern: safe_join(...)
    - pattern: $P.resolve(...)
- id: team.py.audit.pathlib-api
  languages:
  - python
  severity: WARNING
  message: A pathlib/shutil/os file operation receives a non-literal path (audit hint).
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.3.0
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
    change_v4: Rule moi trong v4.1.0 (bo sung do phu, tu phan tich mau bi bo sot tren train v5).
  patterns:
  - pattern-either:
    - pattern: pathlib.Path($P, ...)
    - pattern: Path($P, ...)
    - pattern: shutil.move($A, $P)
    - pattern: os.rename($A, $P)
    - pattern: os.replace($A, $P)
    - pattern: tarfile.open($P, ...)
    - pattern: zipfile.ZipFile($P, ...)
  - pattern-not: pathlib.Path("...", ...)
  - pattern-not: Path("...", ...)
  - pattern-not: Path(__file__, ...)
  - pattern-not: pathlib.Path(__file__, ...)
  - pattern-not: Path()
