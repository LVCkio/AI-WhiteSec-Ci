# Ruleset AI-WhiteSec-CI v4.2.0 | ngon ngu: python | lop: XSS
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/python/xss.* (phai bao) va tests/negative/python/xss.* (khong duoc bao).
rules:
- id: team.py.xss-taint
  languages:
  - python
  severity: ERROR
  message: Request data is returned as HTML without escaping.
  metadata:
    cwe: CWE-79
    owasp: A03:2021
    vuln_class: XSS
    confidence: high
    severity: medium
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.3.0
    change_v4: Rule moi trong v4.
  mode: taint
  pattern-sources:
  - pattern: flask.request.args
  - pattern: flask.request.form
  - pattern: flask.request.values
  - pattern: flask.request.cookies
  - pattern: flask.request.headers
  - pattern: flask.request.get_json(...)
  - pattern: flask.request.json
  - pattern: request.args
  - pattern: request.form
  - pattern: request.values
  - pattern: request.cookies
  - pattern: request.json
  - pattern: request.GET
  - pattern: request.POST
  - pattern: request.COOKIES
  - pattern: request.query_params
  - pattern: request.path_params
  pattern-sinks:
  - pattern-either:
    - pattern: HttpResponse(...)
    - pattern: make_response(...)
    - pattern: render_template_string(...)
    - pattern: Markup(...)
    - pattern: mark_safe(...)
    - pattern: self.write(...)
  pattern-sanitizers:
  - pattern: escape(...)
  - pattern: html.escape(...)
  - pattern: markupsafe.escape(...)
  - pattern: bleach.clean(...)
  - pattern: int(...)
  - pattern: json.dumps(...)
  - pattern: render_template(...)
  - patterns:
    - pattern-either:
      - pattern: $F(...)
      - pattern: $O.$F(...)
    - metavariable-regex:
        metavariable: $F
        regex: (?i)^(validate|sanitize|sanitise|escape|clean|is_?valid)\w*$
- id: team.xss-response-formatting
  languages:
  - python
  severity: ERROR
  message: An HTTP response body is built by formatting values directly.
  metadata:
    cwe: CWE-79
    owasp: A03:2021
    vuln_class: XSS
    confidence: high
    severity: medium
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.3.0
    change_v43: 'severity WARNING -> ERROR (semgrep_tool.md 5.3: severity suy tu confidence high).'
  pattern-either:
  - pattern: HttpResponse("..." % $X, ...)
  - pattern: HttpResponse("...".format(...), ...)
  - pattern: HttpResponse(f"...", ...)
  - pattern: HttpResponse($A + $B, ...)
  - pattern: make_response("..." % $X, ...)
  - pattern: make_response(f"...", ...)
  - pattern: make_response($A + $B, ...)
- id: team.xss-unsafe-html
  languages:
  - python
  severity: ERROR
  message: Potentially untrusted content is inserted into HTML without escaping.
  metadata:
    cwe: CWE-79
    owasp: A03:2021
    vuln_class: XSS
    confidence: high
    severity: medium
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.3.0
    change_v43: 'severity WARNING -> ERROR (semgrep_tool.md 5.3: severity suy tu confidence high).'
  pattern-either:
  - pattern: mark_safe($VALUE)
  - pattern: Markup($VALUE)
  - pattern: SafeString($VALUE)
  - pattern: render_template_string($VALUE)
  - pattern: jinja2.Environment(..., autoescape=False, ...)
  - pattern: Environment(..., autoescape=False, ...)
- id: team.audit.html-output-api
  languages:
  - python
  severity: WARNING
  message: HTML is produced from a non-literal value (audit hint).
  metadata:
    cwe: CWE-79
    owasp: A03:2021
    vuln_class: XSS
    confidence: audit
    severity: medium
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.2.0
    ruleset_version: 4.3.0
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
    change_v4: self.write thay cho $SELF.write (truoc day khop nham f.write ghi file).
  patterns:
  - pattern-either:
    - pattern: HttpResponse($X, ...)
    - pattern: make_response($X, ...)
    - pattern: render_template_string($X, ...)
    - pattern: self.write($X)
    - pattern: self.finish($X)
    - pattern: format_html($X, ...)
    - pattern: SafeText($X)
  - pattern-not: HttpResponse("...", ...)
  - pattern-not: self.write("...")
  - pattern-not: make_response("...", ...)
- id: team.xss-html-string-building
  languages:
  - python
  severity: WARNING
  message: HTML markup is built by interpolating or concatenating values.
  metadata:
    cwe: CWE-79
    owasp: A03:2021
    vuln_class: XSS
    confidence: audit
    severity: medium
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.3.0
  pattern-regex: (?i)(?:\bf"[^"\n]*<\/?[a-z][a-z0-9]*[\s>/][^"\n]*\{|\bf'[^'\n]*<\/?[a-z][a-z0-9]*[\s>/][^'\n]*\{|"[^"\n]*<\/?[a-z][a-z0-9]*[\s>/][^"\n]*"\s*(?:%\s*[\w(]|\+\s*[\w(]|\.format\s*\()|'[^'\n]*<\/?[a-z][a-z0-9]*[\s>/][^'\n]*'\s*(?:%\s*[\w(]|\+\s*[\w(]|\.format\s*\()|[\w)\]]\s*\+\s*[\"']\s*<\/[a-z])
- id: team.py.xss-jinja-autoescape-default
  languages:
  - python
  severity: WARNING
  message: A Jinja2 environment/template is created without autoescape (Jinja2 default is off) (audit).
  metadata:
    cwe: CWE-79
    owasp: A03:2021
    vuln_class: XSS
    confidence: audit
    severity: medium
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.3.0
    change_v4: Rule moi trong v4.1.0 (bo sung do phu, tu phan tich mau bi bo sot tren train v5).
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: jinja2.Environment(...)
      - pattern: Environment(...)
    - pattern-not: jinja2.Environment(..., autoescape=$A, ...)
    - pattern-not: Environment(..., autoescape=$A, ...)
  - pattern: jinja2.Template(...)
- id: team.py.audit.response-body
  languages:
  - python
  severity: WARNING
  message: An HTTP response body is built from a non-literal value (audit hint).
  metadata:
    cwe: CWE-79
    owasp: A03:2021
    vuln_class: XSS
    confidence: audit
    severity: medium
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.3.0
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
    change_v4: Rule moi trong v4.1.0 (bo sung do phu, tu phan tich mau bi bo sot tren train v5).
  patterns:
  - pattern-either:
    - pattern: flask.Response($X, ...)
    - pattern: Response($X, ...)
    - pattern: web.Response(..., text=$X, ...)
    - pattern: web.Response(..., body=$X, ...)
  - pattern-not: Response("...", ...)
  - pattern-not: flask.Response("...", ...)
  - pattern-not: Response(json.dumps(...), ...)
  - pattern-not: flask.Response(json.dumps(...), ...)
  - pattern-not: web.Response(..., text="...", ...)
