# AI-WhiteSec-CI - nhanh P2 Semgrep cho GitLab CI (GitLab CE tu cai, runner Docker tren server3).
# Dung trong .gitlab-ci.yml o goc repo:
#   stages: [build-image, sast, compare, gate]
#   include:
#     - local: security-config/semgrep/ci/gitlab-ci-semgrep.yml
# Quyet dinh (QUYET_DINH_SEMGREP.md): GitLab CE trong may ao; runner Docker; Semgrep ghim 1.181.0;
# finding tang audit chi ghi nhan, KHONG chan build. Job nay KHONG chan build vi finding:
# no chi that bai khi loi cau hinh/moi truong (ma 2) hoac Semgrep loi (ma 3). Viec chan do job gate.
#
# Anh Docker: mac dinh dung anh CO SAN tren may chay runner (server3), build bang
# ci/servers/server3_worker.sh; runner dat pull_policy = if-not-present nen khong can registry.
# Neu GitLab co bat Container Registry: dat bien CI/CD AIWS_SEMGREP_IMAGE = $CI_REGISTRY_IMAGE/aiws-semgrep:<tag>
# va AIWS_BUILD_IMAGE = "1" de job aiws-semgrep-image build + day anh.

variables:
  AIWS_RULESET_VERSION: "4.7.0"
  AIWS_SEMGREP_VERSION: "1.181.0"
  AIWS_SEMGREP_IMAGE: "aiws-semgrep:4.7.0-semgrep1.181.0"

# Tuy chon: build va day anh len Container Registry (chi khi AIWS_BUILD_IMAGE = "1").
# Can runner Docker privileged (docker:dind).
aiws-semgrep-image:
  stage: build-image
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $AIWS_BUILD_IMAGE == "1" && $CI_REGISTRY
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg SEMGREP_VERSION="$AIWS_SEMGREP_VERSION"
        -f security-config/semgrep/ci/Dockerfile -t "$AIWS_SEMGREP_IMAGE" .
    - docker push "$AIWS_SEMGREP_IMAGE"

# P2: quet ca repo bang bo rule team.* dong goi trong anh; xuat semgrep-results.json + scope.json.
# Chay o moi pipeline (push moi nhanh, merge request, chay tay) - xem workflow trong .gitlab-ci.yml goc.
aiws-semgrep:
  stage: sast
  image:
    name: "$AIWS_SEMGREP_IMAGE"
    entrypoint: [""]
  needs:
    - job: aiws-semgrep-image
      optional: true
  variables:
    GIT_DEPTH: "1"
  script:
    - python /opt/aiws/security-config/semgrep/tools/scan_repo.py
        --repo "$CI_PROJECT_DIR"
        --repo-name "$CI_PROJECT_PATH"
        --out "$CI_PROJECT_DIR/semgrep-results.json"
        --scope-out "$CI_PROJECT_DIR/scope.json"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - semgrep-results.json
      - scope.json
