# Active ruleset v4.6.0; retired broad audit patterns are in rules_disabled/.
rules:
- id: team.path-request-taint
  languages:
  - python
  severity: WARNING
  message: Request data is used as a file system path.
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.8.1
    change_v48: 'high -> audit (severity ERROR -> WARNING). precision mau train 1/5 = 0.20; 6/8 finding high tren mau am la os.path.join voi bien thuong. Gate ci-2: sast_only.high = BLOCK.'
    tier_exception: 'Taint giu nguyen nhung ha audit tu v4.8.0: precision mau train v2.6 chi 0.20, Gate ci-2 chan build voi moi finding high.'
  mode: taint
  pattern-sources:
  - pattern: request.args
  - pattern: request.form
  - pattern: request.values
  - pattern: request.files
  - pattern: request.GET
  - pattern: request.POST
  - pattern: request.path_params
  - pattern: request.query_params
  - pattern: request.match_info
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: open($X, ...)
      - pattern: send_file($X, ...)
      - pattern: FileResponse($X, ...)
      - pattern: os.path.join($BASE, ..., $X, ...)
      - pattern: os.remove($X)
      - pattern: os.unlink($X)
      - pattern: shutil.rmtree($X, ...)
      - pattern: Path($X, ...)
    - focus-metavariable: $X
  pattern-sanitizers:
  - pattern: os.path.basename(...)
  - pattern: secure_filename(...)
  - pattern: safe_join(...)
  - pattern: int(...)
- id: team.path-traversal
  languages:
  - python
  severity: ERROR
  message: A user-controlled path may reach a filesystem operation.
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: high
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.2.0
    ruleset_version: 4.8.1
    change_v461: 'regex tho -> pattern AST (regex khop ca chuoi/comment; bao sai tang high khi quet repo that, p2_demo_2026-10-26).'
    change_v43: 'severity WARNING -> ERROR (semgrep_tool.md 5.3: severity suy tu confidence high).'
  patterns:
  - pattern: $F(..., <... request.$A ...>, ...)
  - metavariable-regex:
      metavariable: $F
      regex: (?:^|\.)(?:open|Path|send_file|send_from_directory|FileResponse|serve_file|join)$
  - metavariable-regex:
      metavariable: $A
      regex: ^(?:args|form|values|json|files|GET|POST|path_params|query_params|match_info)$
- id: team.archive-extract-all
  languages:
  - python
  severity: WARNING
  message: Archive members are extracted without filtering their paths.
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.8.1
  patterns:
  - pattern-either:
    - pattern: $ARCHIVE.extractall(...)
    - pattern: $ARCHIVE.extractfile(...)
  - pattern-not: $ARCHIVE.extractall(..., filter=$F, ...)
- id: team.py.audit.pathlib-api
  languages:
  - python
  severity: WARNING
  message: A pathlib/shutil/os file operation receives a non-literal path (audit hint).
  metadata:
    cwe: CWE-22
    owasp: A01:2021
    vuln_class: PATH_TRAVERSAL
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.8.1
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
    change_v4: Rule moi trong v4.1.0 (bo sung do phu, tu phan tich mau bi bo sot tren train v5).
  patterns:
  - pattern-either:
    - pattern: pathlib.Path($P, ...)
    - pattern: Path($P, ...)
    - pattern: shutil.move($A, $P)
    - pattern: os.rename($A, $P)
    - pattern: os.replace($A, $P)
    - pattern: tarfile.open($P, ...)
    - pattern: zipfile.ZipFile($P, ...)
  - pattern-not: pathlib.Path("...", ...)
  - pattern-not: Path("...", ...)
  - pattern-not: Path(__file__, ...)
  - pattern-not: pathlib.Path(__file__, ...)
  - pattern-not: Path()
