# Ruleset AI-WhiteSec-CI v4.2.0 | ngon ngu: python | lop: HARDCODED_CREDENTIALS
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/python/hardcoded_credentials.* (phai bao) va tests/negative/python/hardcoded_credentials.* (khong duoc bao).
rules:
- id: team.hardcoded-auth-header
  languages:
  - python
  severity: ERROR
  message: An Authorization header or signing key is a hardcoded literal.
  metadata:
    cwe: CWE-798
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.2.0
    ruleset_version: 4.6.1
    change_v461: 'regex tho -> pattern AST (regex khop ca chuoi/comment; bao sai tang high khi quet repo that, p2_demo_2026-10-26).'
    change_v43: 'severity WARNING -> ERROR (semgrep_tool.md 5.3: severity suy tu confidence high).'
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: '{..., "Authorization": "$VAL", ...}'
      - pattern: $H["Authorization"] = "$VAL"
    - metavariable-regex:
        metavariable: $VAL
        regex: (?i)^["']?(?:Bearer|Basic|Token)\s+[A-Za-z0-9._~+/=-]{8,}["']?$
  - pattern: jwt.encode($PAYLOAD, "...", ...)
  - pattern: hmac.new("...", ...)
- id: team.hardcoded-credentials
  languages:
  - python
  severity: ERROR
  message: A credential-like variable appears to contain a hardcoded string.
  metadata:
    cwe: CWE-798
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.2.0
    ruleset_version: 4.6.1
    change_v461: 'regex tho -> pattern AST (regex khop ca chuoi/comment; bao sai tang high khi quet repo that, p2_demo_2026-10-26).'
    change_v43: 'severity WARNING -> ERROR (semgrep_tool.md 5.3: severity suy tu confidence high).'
  patterns:
  - pattern-either:
    - pattern: $NAME = "$VAL"
    - pattern: $OBJ.$NAME = "$VAL"
    - pattern: $F(..., $NAME="$VAL", ...)
    - pattern: '{..., "$NAME": "$VAL", ...}'
  - metavariable-regex:
      metavariable: $NAME
      regex: (?i)^["']?\w*(?:password|passwd|pwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key)\w*["']?$
  - metavariable-regex:
      metavariable: $VAL
      regex: ^["']?[^\s"']{4,}["']?$
- id: team.py.hardcoded-password-compare
  languages:
  - python
  severity: ERROR
  message: A password or secret is compared with a hardcoded literal.
  metadata:
    cwe: CWE-259
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.6.1
    change_v4: Rule moi trong v4.
  patterns:
  - pattern-either:
    - pattern: $P == "$LIT"
    - pattern: '"$LIT" == $P'
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^[\w.\[\]'"]*(password|passwd|pwd|secret|api_?key)[\w.\[\]'"]*$
  - metavariable-regex:
      metavariable: $LIT
      regex: ^.{4,}$
