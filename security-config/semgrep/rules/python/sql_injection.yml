# Ruleset AI-WhiteSec-CI v4.2.0 | ngon ngu: python | lop: SQL_INJECTION
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/python/sql_injection.* (phai bao) va tests/negative/python/sql_injection.* (khong duoc bao).
rules:
- id: team.py.sqli-taint
  languages:
  - python
  severity: ERROR
  message: Request data reaches an SQL query string.
  metadata:
    cwe: CWE-89
    owasp: A03:2021
    vuln_class: SQL_INJECTION
    confidence: high
    severity: critical
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.6.1
    change_v4: Rule moi trong v4.
  mode: taint
  pattern-sources:
  - pattern: flask.request.args
  - pattern: flask.request.form
  - pattern: flask.request.values
  - pattern: flask.request.cookies
  - pattern: flask.request.headers
  - pattern: flask.request.get_json(...)
  - pattern: flask.request.json
  - pattern: request.args
  - pattern: request.form
  - pattern: request.values
  - pattern: request.cookies
  - pattern: request.json
  - pattern: request.GET
  - pattern: request.POST
  - pattern: request.COOKIES
  - pattern: request.query_params
  - pattern: request.path_params
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $C.execute($Q, ...)
      - pattern: $C.executemany($Q, ...)
      - pattern: $C.executescript($Q)
      - pattern: $M.objects.raw($Q, ...)
      - pattern: RawSQL($Q, ...)
      - pattern: text($Q)
    - focus-metavariable: $Q
  pattern-sanitizers:
  - pattern: int(...)
  - pattern: float(...)
  - patterns:
    - pattern-either:
      - pattern: $F(...)
      - pattern: $O.$F(...)
    - metavariable-regex:
        metavariable: $F
        regex: (?i)^(validate|sanitize|sanitise|escape|clean|is_?valid)\w*$
- id: team.sql-injection
  languages:
  - python
  severity: ERROR
  message: SQL query appears to use dynamic string construction.
  metadata:
    cwe: CWE-89
    owasp: A03:2021
    vuln_class: SQL_INJECTION
    confidence: high
    severity: critical
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.2.0
    ruleset_version: 4.6.1
    change_v461: 'regex tho -> pattern AST (regex khop ca chuoi/comment; bao sai tang high khi quet repo that, p2_demo_2026-10-26).'
    change_v43: 'severity WARNING -> ERROR (semgrep_tool.md 5.3: severity suy tu confidence high).'
  patterns:
  - pattern-either:
    - pattern: $OBJ.$EXEC(<... f"...{$X}..." ...>, ...)
    - pattern: $OBJ.$EXEC(<... "..." % $X ...>, ...)
    - pattern: $OBJ.$EXEC(<... "..." + $X ...>, ...)
    - pattern: $OBJ.$EXEC(<... "...".format(...) ...>, ...)
    - pattern: $EXEC(<... f"...{$X}..." ...>, ...)
    - pattern: $EXEC(<... "..." % $X ...>, ...)
    - pattern: $EXEC(<... "..." + $X ...>, ...)
    - pattern: $EXEC(<... "...".format(...) ...>, ...)
  - metavariable-regex:
      metavariable: $EXEC
      regex: ^(?:execute|executemany|executescript|raw|extra|text)$
- id: team.audit.sql-api
  languages:
  - python
  severity: WARNING
  message: SQL execution API used (audit hint).
  metadata:
    cwe: CWE-89
    owasp: A03:2021
    vuln_class: SQL_INJECTION
    confidence: audit
    severity: critical
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.2.0
    ruleset_version: 4.6.1
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
    change_v4: Chi xet doi tuong ten giong DB (cursor/conn/db/session/engine) va bo cau truy van hang chuoi.
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: $C.execute($Q, ...)
      - pattern: $C.executemany($Q, ...)
      - pattern: $C.executescript($Q)
    - pattern-not: $C.execute("...", ...)
    - pattern-not: $C.executemany("...", ...)
    - metavariable-regex:
        metavariable: $C
        regex: (?i)^(self\.)?(\w*cur\w*|\w*conn\w*|\w*db\w*|\w*session\w*|\w*engine\w*|c)$
  - pattern: $M.objects.raw($Q, ...)
  - pattern: $QS.extra(...)
  - pattern: RawSQL($Q, ...)
  - pattern: text($Q)
- id: team.sql-string-building
  languages:
  - python
  severity: WARNING
  message: SQL text is built by interpolating or concatenating values.
  metadata:
    cwe: CWE-89
    owasp: A03:2021
    vuln_class: SQL_INJECTION
    confidence: audit
    severity: critical
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.6.1
  pattern-regex: (?i)(?:\bf"[^"\n]*\b(?:select\s|insert\s+into|delete\s+from|update\s+\S+\s+set|where\s|order\s+by|group\s+by|values\s*\(|join\s)[^"\n]*\{|\bf'[^'\n]*\b(?:select\s|insert\s+into|delete\s+from|update\s+\S+\s+set|where\s|order\s+by|group\s+by|values\s*\(|join\s)[^'\n]*\{|"[^"\n]*\b(?:select\s|insert\s+into|delete\s+from|update\s+\S+\s+set|where\s|order\s+by|group\s+by|values\s*\(|join\s)[^"\n]*"\s*(?:%\s*[\w(]|\+\s*[\w(]|\.format\s*\()|'[^'\n]*\b(?:select\s|insert\s+into|delete\s+from|update\s+\S+\s+set|where\s|order\s+by|group\s+by|values\s*\(|join\s)[^'\n]*'\s*(?:%\s*[\w(]|\+\s*[\w(]|\.format\s*\())
