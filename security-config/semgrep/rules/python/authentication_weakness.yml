# Active ruleset v4.6.0; retired broad audit patterns are in rules_disabled/.
rules:
- id: team.authentication-weakness
  languages:
  - python
  severity: ERROR
  message: Authentication or token verification appears to be disabled.
  metadata:
    cwe: CWE-287
    owasp: A07:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: high
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.6.1
    change_v43: 'severity WARNING -> ERROR (semgrep_tool.md 5.3: severity suy tu confidence high).'
  pattern-either:
  - pattern: 'jwt.decode(..., options={"verify_signature": False}, ...)'
  - pattern: jwt.decode(..., verify=False, ...)
  - pattern: jwt.decode(..., algorithms=["none"], ...)
- id: team.auth-secret-equality
  languages:
  - python
  severity: WARNING
  message: A secret, token or signature is compared with a plain equality operator.
  metadata:
    cwe: CWE-287
    owasp: A07:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.6.1
    change_v4: Chi xet bien/thuoc tinh (khong xet bieu thuc goi ham); bo so sanh voi hang so (chuyen sang rule hardcoded-password-compare).
  patterns:
  - pattern-either:
    - pattern: $A == $B
    - pattern: $A != $B
  - pattern-not: $A == None
  - pattern-not: $A != None
  - pattern-not: $A == "..."
  - pattern-not: $A != "..."
  - pattern-not: '"..." == $A'
  - pattern-not: '"..." != $A'
  - pattern-not: $A == True
  - pattern-not: $A == False
  - pattern-not: $A == 0
  - metavariable-regex:
      metavariable: $A
      regex: (?i)^[\w.\[\]'"]*(password|passwd|token|secret|signature|digest|hmac|api_?key|nonce)[\w.\[\]'"]*$
- id: team.auth-session-fixation
  languages:
  - python
  severity: WARNING
  message: A login function stores the user in the session without regenerating it (audit).
  metadata:
    cwe: CWE-384
    owasp: A07:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.6.1
  patterns:
  - pattern-inside: "def $FUNC(...):\n  ...\n"
  - metavariable-regex:
      metavariable: $FUNC
      regex: (?i).*(login|log_in|signin|sign_in|authenticate).*
  - pattern: session[$KEY] = $VALUE
  - pattern-not-inside: 'session.clear()

      ...

      '
  - pattern-not-inside: '$REQ.session.cycle_key()

      ...

      '
  - pattern-not-inside: 'session.regenerate()

      ...

      '
- id: team.auth-weak-password-hash
  languages:
  - python
  severity: WARNING
  message: A fast/broken hash is applied to a password (audit).
  metadata:
    cwe: CWE-916
    owasp: A02:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.6.1
  patterns:
  - pattern-either:
    - pattern: hashlib.md5($X, ...)
    - pattern: hashlib.sha1($X, ...)
    - pattern: hashlib.md5($X.encode(...))
    - pattern: hashlib.sha1($X.encode(...))
  - metavariable-regex:
      metavariable: $X
      regex: (?i).*(pass|pwd|secret).*
