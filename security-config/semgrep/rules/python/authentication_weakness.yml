# Ruleset AI-WhiteSec-CI v4.2.0 | ngon ngu: python | lop: AUTHENTICATION_WEAKNESS
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/python/authentication_weakness.* (phai bao) va tests/negative/python/authentication_weakness.* (khong duoc bao).
rules:
- id: team.authentication-weakness
  languages:
  - python
  severity: ERROR
  message: Authentication or token verification appears to be disabled.
  metadata:
    cwe: CWE-287
    owasp: A07:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: high
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.3.1
    change_v43: 'severity WARNING -> ERROR (semgrep_tool.md 5.3: severity suy tu confidence high).'
  pattern-either:
  - pattern: 'jwt.decode(..., options={"verify_signature": False}, ...)'
  - pattern: jwt.decode(..., verify=False, ...)
  - pattern: jwt.decode(..., algorithms=["none"], ...)
- id: team.audit.auth-code
  languages:
  - python
  severity: WARNING
  message: Authentication-sensitive code (token/session/password/signature checks) (audit hint).
  metadata:
    cwe: CWE-287
    owasp: A07:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.2.0
    ruleset_version: 4.3.1
    change_v43: 'severity INFO -> WARNING (semgrep_tool.md 5.3: severity suy tu confidence audit).'
    change_v42: Bo hmac.compare_digest/check_password/check_password_hash - day la API AN TOAN duoc khuyen nghi, rule khong duoc bao chinh cach sua.
  pattern-either:
  - pattern: jwt.decode(...)
  - pattern: authenticate(...)
  - pattern: login_user(...)
  - pattern: $X.verify_signature(...)
  - pattern: $X.validate_signature(...)
  - patterns:
    - pattern: "def $F(...):\n  ...\n"
    - metavariable-regex:
        metavariable: $F
        regex: (?i)^(login|logout|authenticate|verify_(token|signature|password)|check_(auth|password|token)|is_authenticated|has_perm)
- id: team.auth-secret-equality
  languages:
  - python
  severity: WARNING
  message: A secret, token or signature is compared with a plain equality operator.
  metadata:
    cwe: CWE-287
    owasp: A07:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.1.0
    ruleset_version: 4.3.1
    change_v4: Chi xet bien/thuoc tinh (khong xet bieu thuc goi ham); bo so sanh voi hang so (chuyen sang rule hardcoded-password-compare).
  patterns:
  - pattern-either:
    - pattern: $A == $B
    - pattern: $A != $B
  - pattern-not: $A == None
  - pattern-not: $A != None
  - pattern-not: $A == "..."
  - pattern-not: $A != "..."
  - pattern-not: '"..." == $A'
  - pattern-not: '"..." != $A'
  - pattern-not: $A == True
  - pattern-not: $A == False
  - pattern-not: $A == 0
  - metavariable-regex:
      metavariable: $A
      regex: (?i)^[\w.\[\]'"]*(password|passwd|token|secret|signature|digest|hmac|api_?key|nonce)[\w.\[\]'"]*$
- id: team.auth-session-fixation
  languages:
  - python
  severity: WARNING
  message: A login function stores the user in the session without regenerating it (audit).
  metadata:
    cwe: CWE-384
    owasp: A07:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.3.1
  patterns:
  - pattern-inside: "def $FUNC(...):\n  ...\n"
  - metavariable-regex:
      metavariable: $FUNC
      regex: (?i).*(login|log_in|signin|sign_in|authenticate).*
  - pattern: session[$KEY] = $VALUE
  - pattern-not-inside: 'session.clear()

      ...

      '
  - pattern-not-inside: '$REQ.session.cycle_key()

      ...

      '
  - pattern-not-inside: 'session.regenerate()

      ...

      '
- id: team.auth-weak-password-hash
  languages:
  - python
  severity: WARNING
  message: A fast/broken hash is applied to a password (audit).
  metadata:
    cwe: CWE-916
    owasp: A02:2021
    vuln_class: AUTHENTICATION_WEAKNESS
    confidence: audit
    severity: high
    scope: Python; Flask, Django, FastAPI, Tornado, DB-API (sqlite3, psycopg2, MySQLdb), SQLAlchemy
    rule_version: 1.0.0
    ruleset_version: 4.3.1
  patterns:
  - pattern-either:
    - pattern: hashlib.md5($X, ...)
    - pattern: hashlib.sha1($X, ...)
    - pattern: hashlib.md5($X.encode(...))
    - pattern: hashlib.sha1($X.encode(...))
  - metavariable-regex:
      metavariable: $X
      regex: (?i).*(pass|pwd|secret).*
