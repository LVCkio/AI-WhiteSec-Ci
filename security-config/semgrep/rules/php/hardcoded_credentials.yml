# Ruleset AI-WhiteSec-CI v4.8.1 | ngon ngu: php | lop: HARDCODED_CREDENTIALS
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/php/hardcoded_credentials.* (phai bao) va tests/negative/php/hardcoded_credentials.* (khong duoc bao).
rules:
- id: team.php.hardcoded-password-compare
  languages:
  - php
  severity: WARNING
  message: A password or secret is compared with a hardcoded literal.
  metadata:
    cwe: CWE-259
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: audit
    severity: high
    scope: PHP; superglobals ($_GET/$_POST/...), mysqli, PDO, pg_*, include/require
    rule_version: 1.1.0
    ruleset_version: 4.8.1
    change_v48: 'high -> audit (severity ERROR -> WARNING). precision mau train 1/5 = 0.20; bao ca so sanh voi chuoi mat na/co (=== ''*****'', === ''true''). Gate ci-2: sast_only.high = BLOCK.'
    change_v4: Rule moi trong v4.
  patterns:
  - pattern-either:
    - pattern: $P === "$LIT"
    - pattern: $P == "$LIT"
    - pattern: '"$LIT" === $P'
    - pattern: '"$LIT" == $P'
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^\$[\w\[\]'"\->]*(password|passwd|pwd|secret|api_?key)[\w\[\]'"\->]*$
  - metavariable-regex:
      metavariable: $LIT
      regex: ^.{4,}$
- id: team.php.hardcoded-secret
  languages:
  - php
  severity: WARNING
  message: A credential is a hardcoded literal.
  metadata:
    cwe: CWE-798
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: audit
    severity: high
    scope: PHP; superglobals ($_GET/$_POST/...), mysqli, PDO, pg_*, include/require
    rule_version: 1.1.0
    ruleset_version: 4.8.1
    change_v481: 'high -> audit (phuong an A, tang high chi giu rule P >= 0.80 tren train). precision mau train v2.6 4/9 = 0.44.'
  pattern-either:
  - patterns:
    - pattern: $VAR = '$VAL';
    - metavariable-regex:
        metavariable: $VAR
        regex: (?i).*(password|passwd|pwd|secret|api_?key|access_?token|private_?key).*
    - metavariable-regex:
        metavariable: $VAL
        regex: ^.{4,}$
  - patterns:
    - pattern: $ARR['$KEY'] = '$VAL';
    - metavariable-regex:
        metavariable: $KEY
        regex: (?i).*(password|passwd|pwd|secret|api_?key|access_?token).*
    - metavariable-regex:
        metavariable: $VAL
        regex: ^.{4,}$
  - patterns:
    - pattern: define('$KEY', '$VAL');
    - metavariable-regex:
        metavariable: $KEY
        regex: (?i).*(password|passwd|pwd|secret|api_?key|token).*
    - metavariable-regex:
        metavariable: $VAL
        regex: ^.{4,}$
  - pattern: new PDO($DSN, $USER, '...')
  - pattern: mysqli_connect($H, $U, '...', ...)
