# Ruleset AI-WhiteSec-CI v4.2.0 | ngon ngu: php | lop: HARDCODED_CREDENTIALS
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/php/hardcoded_credentials.* (phai bao) va tests/negative/php/hardcoded_credentials.* (khong duoc bao).
rules:
- id: team.php.hardcoded-password-compare
  languages:
  - php
  severity: ERROR
  message: A password or secret is compared with a hardcoded literal.
  metadata:
    cwe: CWE-259
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: PHP; superglobals ($_GET/$_POST/...), mysqli, PDO, pg_*, include/require
    rule_version: 1.0.0
    ruleset_version: 4.7.0
    change_v4: Rule moi trong v4.
  patterns:
  - pattern-either:
    - pattern: $P === "$LIT"
    - pattern: $P == "$LIT"
    - pattern: '"$LIT" === $P'
    - pattern: '"$LIT" == $P'
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^\$[\w\[\]'"\->]*(password|passwd|pwd|secret|api_?key)[\w\[\]'"\->]*$
  - metavariable-regex:
      metavariable: $LIT
      regex: ^.{4,}$
- id: team.php.hardcoded-secret
  languages:
  - php
  severity: ERROR
  message: A credential is a hardcoded literal.
  metadata:
    cwe: CWE-798
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: PHP; superglobals ($_GET/$_POST/...), mysqli, PDO, pg_*, include/require
    rule_version: 1.0.0
    ruleset_version: 4.7.0
  pattern-either:
  - patterns:
    - pattern: $VAR = '$VAL';
    - metavariable-regex:
        metavariable: $VAR
        regex: (?i).*(password|passwd|pwd|secret|api_?key|access_?token|private_?key).*
    - metavariable-regex:
        metavariable: $VAL
        regex: ^.{4,}$
  - patterns:
    - pattern: $ARR['$KEY'] = '$VAL';
    - metavariable-regex:
        metavariable: $KEY
        regex: (?i).*(password|passwd|pwd|secret|api_?key|access_?token).*
    - metavariable-regex:
        metavariable: $VAL
        regex: ^.{4,}$
  - patterns:
    - pattern: define('$KEY', '$VAL');
    - metavariable-regex:
        metavariable: $KEY
        regex: (?i).*(password|passwd|pwd|secret|api_?key|token).*
    - metavariable-regex:
        metavariable: $VAL
        regex: ^.{4,}$
  - pattern: new PDO($DSN, $USER, '...')
  - pattern: mysqli_connect($H, $U, '...', ...)
