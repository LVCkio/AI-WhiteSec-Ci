# Ruleset AI-WhiteSec-CI v4.8.1 | ngon ngu: java | lop: HARDCODED_CREDENTIALS
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/java/hardcoded_credentials.* (phai bao) va tests/negative/java/hardcoded_credentials.* (khong duoc bao).
rules:
- id: team.java.hardcoded-password-compare
  languages:
  - java
  severity: ERROR
  message: A password or secret is compared with a hardcoded literal.
  metadata:
    cwe: CWE-259
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.0.0
    ruleset_version: 4.8.1
    change_v4: Rule moi trong v4.
  patterns:
  - pattern-either:
    - pattern: '"$LIT".equals($P)'
    - pattern: $P.equals("$LIT")
    - pattern: '"$LIT".equalsIgnoreCase($P)'
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^[\w.]*(password|passwd|pwd|secret|apikey|api_key)[\w.]*$
  - metavariable-regex:
      metavariable: $LIT
      regex: ^.{4,}$
- id: team.java.hardcoded-secret
  languages:
  - java
  severity: ERROR
  message: A credential or signing key is a hardcoded literal.
  metadata:
    cwe: CWE-798
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: Java; Servlet (javax/jakarta), Spring MVC, JDBC, JPA, JdbcTemplate
    rule_version: 1.1.0
    ruleset_version: 4.8.1
    change_v471: 'Bo qua gia tri gia/placeholder khi $VAL khop nguyen chuoi (secret, password, test, root, abc123, your ..., <...>, ${...}, ten khoa dang client.key.password). Do tren train v2.2 (proxy regex, creddata): bo 27/36 mau am bi bao high, khong mat mau duong nao (0/106). Chua do bang Semgrep.'
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: $TYPE $NAME = "$VAL";
      - pattern: $NAME = "$VAL";
    - metavariable-regex:
        metavariable: $NAME
        regex: (?i).*(password|passwd|pwd|secret|api_?key|access_?token|private_?key|jwt_?key|signing_?key).*
    - metavariable-regex:
        metavariable: $VAL
        regex: '(?i)^(?!["\'']?(?:secret|password|passwd|pass|test|root|admin|changeme|abc123|foobar|dummy[\w-]*|your[ _-][\w -]*|example[\w-]*|sample[\w-]*|token|client[ _]key|client[ _]secret|access_key_id|secret_access_key|secret_key|access_token|refresh_token|client_secret|<[^<>]+>|\$\{[^{}]+\}|\{\{[^{}]+\}\}|[a-z]+(?:\.[a-z]+)+)["\'']?$).{4,}$'
  - pattern: DriverManager.getConnection($URL, $USER, "...")
  - pattern: $B.signWith($ALG, "...")
  - pattern: $B.setSigningKey("...")
  - pattern: Algorithm.HMAC256("...")
