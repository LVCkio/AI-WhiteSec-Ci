# Ruleset AI-WhiteSec-CI v4.2.0 | ngon ngu: javascript | lop: HARDCODED_CREDENTIALS
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/javascript/hardcoded_credentials.* (phai bao) va tests/negative/javascript/hardcoded_credentials.* (khong duoc bao).
rules:
- id: team.js.hardcoded-password-compare
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: A password or secret is compared with a hardcoded literal.
  metadata:
    cwe: CWE-259
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: JavaScript/TypeScript; Node.js, Express, child_process, fs, DOM, jQuery, jsonwebtoken
    rule_version: 1.1.0
    ruleset_version: 4.7.0
    change_v42: Bo so sanh voi chuoi 'undefined'/'null'/'true'/'false' (Juice Shop changePassword/resetPassword - kiem tra rong, khong phai mat khau).
    change_v4: Rule moi trong v4.
  patterns:
  - pattern-either:
    - pattern: $P === "$LIT"
    - pattern: '"$LIT" === $P'
    - pattern: $P == "$LIT"
    - pattern: '"$LIT" == $P'
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^[\w.$]*(password|passwd|pwd|secret|apikey|api_key)[\w.$]*$
  - metavariable-regex:
      metavariable: $LIT
      regex: (?i)^(?!(?:undefined|null|true|false|none|nil|nan)$).{4,}$
- id: team.js.hardcoded-secret
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: A credential or signing key is a hardcoded literal.
  metadata:
    cwe: CWE-798
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: JavaScript/TypeScript; Node.js, Express, child_process, fs, DOM, jQuery, jsonwebtoken
    rule_version: 1.0.0
    ruleset_version: 4.7.0
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: const $NAME = "$VAL"
      - pattern: let $NAME = "$VAL"
      - pattern: var $NAME = "$VAL"
      - pattern: '{..., $NAME: "$VAL", ...}'
    - metavariable-regex:
        metavariable: $NAME
        regex: (?i).*(password|passwd|pwd|secret|api_?key|access_?token|private_?key|jwt_?key|signing_?key).*
    - metavariable-regex:
        metavariable: $VAL
        regex: ^.{4,}$
  - pattern: $JWT.sign($P, "...", ...)
  - pattern: $JWT.verify($T, "...", ...)
