# Ruleset AI-WhiteSec-CI v4.8.1 | ngon ngu: javascript | lop: HARDCODED_CREDENTIALS
# confidence: high = ket luan truc tiep; audit = bat rong, can ra soat (luong SAST doc lap voi CodeBERT).
# Test: tests/positive/javascript/hardcoded_credentials.* (phai bao) va tests/negative/javascript/hardcoded_credentials.* (khong duoc bao).
rules:
- id: team.js.hardcoded-password-compare
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: A password or secret is compared with a hardcoded literal.
  metadata:
    cwe: CWE-259
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: JavaScript/TypeScript; Node.js, Express, child_process, fs, DOM, jQuery, jsonwebtoken
    rule_version: 1.1.0
    ruleset_version: 4.8.1
    change_v42: Bo so sanh voi chuoi 'undefined'/'null'/'true'/'false' (Juice Shop changePassword/resetPassword - kiem tra rong, khong phai mat khau).
    change_v4: Rule moi trong v4.
  patterns:
  - pattern-either:
    - pattern: $P === "$LIT"
    - pattern: '"$LIT" === $P'
    - pattern: $P == "$LIT"
    - pattern: '"$LIT" == $P'
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^[\w.$]*(password|passwd|pwd|secret|apikey|api_key)[\w.$]*$
  - metavariable-regex:
      metavariable: $LIT
      regex: (?i)^(?!(?:undefined|null|true|false|none|nil|nan)$).{4,}$
- id: team.js.hardcoded-secret
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: A credential or signing key is a hardcoded literal.
  metadata:
    cwe: CWE-798
    owasp: A07:2021
    vuln_class: HARDCODED_CREDENTIALS
    confidence: high
    severity: high
    scope: JavaScript/TypeScript; Node.js, Express, child_process, fs, DOM, jQuery, jsonwebtoken
    rule_version: 1.2.0
    ruleset_version: 4.8.1
    change_v48: 'Them vao danh sach bo qua: gia tri co khoang trang (keyboard cat, Confirm password; tru khoa PEM -----BEGIN) va chuoi snake_case chu thuong (foo_secret, password_dictionary_error); ap dung cung bo loc cho literal trong jwt.sign/jwt.verify. Ly do: 14 mau am CredData bi tang high bao tren train v2.6 (high_neg_triage_v26.csv).'
    change_v471: 'Bo qua gia tri gia/placeholder khi $VAL khop nguyen chuoi (secret, password, test, root, abc123, your ..., <...>, ${...}, ten khoa dang client.key.password). Do tren train v2.2 (proxy regex, creddata): bo 27/36 mau am bi bao high, khong mat mau duong nao (0/106). Chua do bang Semgrep.'
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: const $NAME = "$VAL"
      - pattern: let $NAME = "$VAL"
      - pattern: var $NAME = "$VAL"
      - pattern: '{..., $NAME: "$VAL", ...}'
    - metavariable-regex:
        metavariable: $NAME
        regex: (?i).*(password|passwd|pwd|secret|api_?key|access_?token|private_?key|jwt_?key|signing_?key).*
    - metavariable-regex:
        metavariable: $VAL
        regex: '(?i)^(?!["\'']?(?:secret|password|passwd|pass|test|root|admin|changeme|abc123|foobar|dummy[\w-]*|your[ _-][\w -]*|example[\w-]*|sample[\w-]*|token|client[ _]key|client[ _]secret|access_key_id|secret_access_key|secret_key|access_token|refresh_token|client_secret|<[^<>]+>|\$\{[^{}]+\}|\{\{[^{}]+\}\}|[a-z]+(?:\.[a-z]+)+|[a-z]+(?:_[a-z]+)+|(?!.*-----BEGIN)[^"\'']*\s[^"\'']*)["\'']?$).{4,}$'
  - patterns:
    - pattern-either:
      - pattern: $JWT.sign($P, "$VAL", ...)
      - pattern: $JWT.verify($T, "$VAL", ...)
    - metavariable-regex:
        metavariable: $VAL
        regex: '(?i)^(?!["\'']?(?:secret|password|passwd|pass|test|root|admin|changeme|abc123|foobar|dummy[\w-]*|your[ _-][\w -]*|example[\w-]*|sample[\w-]*|token|client[ _]key|client[ _]secret|access_key_id|secret_access_key|secret_key|access_token|refresh_token|client_secret|<[^<>]+>|\$\{[^{}]+\}|\{\{[^{}]+\}\}|[a-z]+(?:\.[a-z]+)+|[a-z]+(?:_[a-z]+)+|(?!.*-----BEGIN)[^"\'']*\s[^"\'']*)["\'']?$).{4,}$'
