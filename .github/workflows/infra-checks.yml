name: Infrastructure contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Checkmarx fixture → Gateway → final CodeBERT demo
        run: python scripts/smoke_demo.py --offline
      - name: Validate both Compose configurations
        env:
          GATEWAY_API_KEY: ci-validation-gateway-only
          SERVICE_API_KEY: ci-validation-service-only
          POSTGRES_PASSWORD: ci-validation-database-only
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.demo.yaml config --quiet
