name: Skeleton CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, inference]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements.txt
      - name: Install dependencies
        run: pip install -r ${{ matrix.component }}/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ matrix.component }}
        run: pytest ${{ matrix.component }}/tests -q

  compile-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile pipeline and experiment scripts
        run: python -m compileall pipeline experiments

