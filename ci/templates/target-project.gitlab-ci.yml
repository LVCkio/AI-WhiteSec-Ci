# =====================================================================================================
# MAU .gitlab-ci.yml cho PROJECT CAN QUET (khong phai AI-WhiteSec-Ci) - 19/11/2026.
# Chep file nay vao goc project can quet, dat ten .gitlab-ci.yml, sua 2 cho "root/ai-whitesec-ci" va "main"
# neu duong dan / nhanh cua project AI-WhiteSec-Ci tren GitLab khac. Pipeline 1, Pipeline 2 va job Semgrep
# deu lay tu AI-WhiteSec-Ci, khong can chep file nao khac.
#
# Dieu kien (lam MOT lan, tren GitLab):
#   1. Nguoi push / tao MR o project nay co quyen doc project AI-WhiteSec-Ci (include:project doc file voi
#      quyen cua nguoi kich hoat pipeline).
#   2. Hai runner phai phuc vu duoc project nay: runner shell tag aiws-orchestrator (Server 1) va runner Docker
#      tag aiws-worker (Server 3). Runner dang la "project runner" cua AI-WhiteSec-Ci -> vao project nay:
#      Settings -> CI/CD -> Runners -> Enable cho tung runner (hoac dang ky lai thanh group/instance runner).
#   3. Bien CI/CD AIWS_DB_DSN (P5 ghi PostgreSQL Server 2) dat o project nay hoac o group (Masked).
#   4. Ref "main" phai co ban ci/ va security-config/semgrep/ can dung (vd sau khi merge nhanh semgrep/v481).
# Bien GitLab cho phep trong include: project/ref: chi bien project/group/instance va CI_PROJECT_*; KHONG dung
# duoc bien khai bao trong file nay -> de nguyen chu.
# =====================================================================================================

include:
  - project: "root/ai-whitesec-ci"
    ref: main
    file: "/ci/pipeline1-orchestrator.yml"

dispatch-worker:
  extends: .aiws-dispatch
  trigger:
    include:
      - project: "root/ai-whitesec-ci"
        ref: main
        file: "/ci/pipeline2-worker.yml"
