name: whitesec-ci

services:
  gateway:
    image: whitesec-gateway:local
    build:
      context: .
      target: runtime
    command: ["python", "-m", "uvicorn", "app.gateway:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in .env}
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env}
      CODEBERT_URL: http://codebert:8001
      POLICY_PATH: /app/config/final-policy.json
      DATABASE_URL: postgresql://whitesec:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/whitesec
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      codebert:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  codebert:
    image: whitesec-codebert:local
    build:
      context: .
      target: model
    command: ["python", "-m", "uvicorn", "app.codebert:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env}
      MODEL_MODE: real
      MODEL_DIR: /models/current
    volumes:
      - ./models:/models:ro
    healthcheck:
      # Liveness keeps Gateway reachable while readiness reports a missing model.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whitesec
      POSTGRES_DB: whitesec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - audit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whitesec -d whitesec"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

volumes:
  audit-data:

networks:
  backend:
    internal: true
